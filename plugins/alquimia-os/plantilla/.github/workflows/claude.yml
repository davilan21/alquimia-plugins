name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Autentica con tu SUSCRIPCIÓN (Pro/Max), no con una cuenta de API de prepago.
          # Genera el token con `claude setup-token` y guárdalo como secreto del repo
          # con el nombre exacto CLAUDE_CODE_OAUTH_TOKEN.
          # Consecuencia: no hay factura por token; el consumo sale de tu cupo de suscripción,
          # el mismo que usas en sesiones interactivas.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
